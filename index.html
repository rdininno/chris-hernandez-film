<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chris Hernandez Film</title>
  </head>
  <body>
    <div class="loader" data-loader aria-hidden="true">
      <div class="leader">
        <div class="leader__sweep" data-leader-sweep></div>
        <svg class="leader__lines" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="49" />
          <circle cx="50" cy="50" r="40" />
          <line x1="0" y1="50" x2="100" y2="50" />
          <line x1="50" y1="0" x2="50" y2="100" />
        </svg>
        <span class="leader__number" data-leader-number>8</span>
      </div>
      <span class="loader__count" data-loader-count>0</span>
      <svg class="cutout" data-cutout aria-hidden="true">
        <defs>
          <mask id="name-mask">
            <rect width="100%" height="100%" fill="white" />
            <g data-cutout-name>
              <path data-line="CHRIS" fill="black" />
              <path data-line="HERNANDEZ" fill="black" />
            </g>
          </mask>
        </defs>
        <rect
          class="cutout__fill"
          width="100%"
          height="100%"
          mask="url(#name-mask)"
        />
      </svg>
    </div>

    <main id="app">
      <header class="masthead">
        <h1 class="masthead__title" data-logo>Chris Hernandez</h1>

        <p class="masthead__bio">Writer, Director, Editor</p>
        <span class="masthead__horizon" aria-hidden="true"></span>
      </header>

      <div class="films__titles" data-film-titles></div>
      <dl class="credits" data-film-credits></dl>

      <button class="stage-close" type="button" data-stage-close>
        Close ×
      </button>
      <div class="lights" data-lights aria-hidden="true"></div>

      <div class="screen" data-screen>
        <img class="screen__still" alt="" />
        <div class="screen__player"></div>
      </div>

      <section class="films" data-films aria-label="Films"></section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
